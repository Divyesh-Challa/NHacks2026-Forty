# Relay tunables — the single source of truth for thresholds and timings.
# Loaded by backend (backend/app/config.py) and signal service (signal/config.py).
# The frontend reads the [ui] section from GET /config.

[input]
reliability_cutoff = 0.6     # below this a signal is unreliable
recover_cutoff = 0.75        # must stay at/above this to switch back (hysteresis)
remap_window = 10            # attempts below cutoff before remapping
recover_window = 20          # attempts above recover_cutoff before switching back
debounce_ms = 300            # ignore duplicate commands within this window

[ui]
scan_interval_ms = 1500
flick_px = 160               # mouse-flick sim: cursor this far from screen centre = one look
flick_rearm_px = 50          # ...and must come back this close before the next look

[signal]
sample_rate_hz = 500
eog_lowpass_hz = 10.0
eog_baseline_s = 1.0         # EOG drift: slow baseline (time constant), frozen while the eyes are moving
refractory_ms = 400
reliability_interval_ms = 1000
attempt_window = 8           # reliability: accuracy over the last N gesture attempts per signal
rest_window = 20             # reliability: false-trigger rate over the last N rest seconds per signal
default_accuracy = 0.9       # seed when a signal has no calibration yet
default_false_trigger_rate = 0.05

[detectors]
# Defaults until calibration.py has run (it writes signal/calibration.json, which overrides these).
# Units are ADC counts after filtering. threshold = detect; floor = "an attempt that fell short"
# (counts as a missed attempt in live reliability). Tuned to the synthetic source.
eog_threshold = 80.0
eog_floor = 40.0
eog_invert = false            # flip if look_left reads positive on A0 (calibration detects this)
eog_confirm_ms = 60           # must stay past threshold this long (rejects spikes)
eog_rearm_ms = 1500           # after a look, ignore the opposite direction this long (return-to-centre overshoot)
blink_threshold = 110.0
blink_floor = 40.0
blink_max_ms = 400            # longer vertical excursions are looks, not blinks
double_blink_ms = 700         # two blinks within this = blink_double
vert_threshold = 100.0        # A1 look up/down (held, so it outlasts a blink)
vert_floor = 50.0
vert_invert = false           # flip if look_up reads negative on A1 (calibration detects this)
vert_pair_ms = 350            # a blink's deep trough / second spike follows within this; a look's doesn't
vert_rearm_ms = 2500          # rebound after a vertical look arrives 1.8-2.3 s later (measured), so longer than eog_rearm_ms
max_excursion_s = 5.0         # a "movement" longer than this re-baselines (electrode shift)

[synthetic]
adc_mid = 512                # 10-bit ADC centre, same units the Arduino prints
noise = 4.0                  # white noise (ADC counts, std)
mains = 6.0                  # 60 Hz pickup amplitude
drift = 25.0                 # slow baseline wander amplitude
saccade = 160.0              # look left/right step on A0
blink = 220.0                # blink spike on A1

[predict]
timeout_s = 2.0
max_recent_messages = 5
